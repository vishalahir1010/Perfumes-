<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8860A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5E0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8860A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1F3C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.4"/>
  <rect x="38" y="18" width="24" height="8" rx="3" fill="url(#capGrad)" filter="url(#glow)"/>
  <rect x="42" y="25" width="16" height="7" rx="1" fill="#C8860A"/>
  <rect x="26" y="32" width="48" height="52" rx="12" fill="url(#bottleGrad)" opacity="0.15"/>
  <rect x="26" y="32" width="48" height="52" rx="12" fill="none" stroke="url(#bottleGrad)" stroke-width="2.5"/>
  <rect x="28.5" y="34.5" width="43" height="47" rx="10.5" fill="url(#bottleGrad)" opacity="0.35"/>
  <rect x="31" y="38" width="10" height="28" rx="5" fill="white" opacity="0.12"/>
  <text x="50" y="65" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#F0C842" text-anchor="middle" letter-spacing="1" filter="url(#glow)" opacity="0.95">PS</text>
</svg>